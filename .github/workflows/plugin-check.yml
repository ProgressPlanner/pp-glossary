name: 'WordPress.org Plugin Check'
on: # rebuild any PRs and main branch changes
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

        - name: Setup PHP
          uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
          with:
            php-version: '8.3'
            coverage: none
            tools: composer:v2, wp-cli

        - name: Install dist-archive-command
          run: |
            mkdir -p "$RUNNER_TEMP/wp-cli-dist"
            composer require --working-dir="$RUNNER_TEMP/wp-cli-dist" \
              --no-interaction --no-plugins --no-scripts --prefer-dist \
              'wp-cli/dist-archive-command:^3.1'

        - name: Build plugin
          run: |
            wp --require="$RUNNER_TEMP/wp-cli-dist/vendor/autoload.php" dist-archive . ./${{ github.event.repository.name }}.zip
            mkdir build
            unzip ${{ github.event.repository.name }}.zip -d build

        - name: Run plugin check
          uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
          with:
            build-dir: './build/${{ github.event.repository.name }}'
