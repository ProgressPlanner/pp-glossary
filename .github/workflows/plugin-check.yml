name: 'WordPress.org Plugin Check'
on: # rebuild any PRs and main branch changes
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

        - name: Setup PHP
          uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
          with:
            php-version: '8.3'
            coverage: none
            tools: wp-cli

        - name: Install dist-archive-command
          run: wp package install wp-cli/dist-archive-command:^3.1

        - name: Build plugin
          run: |
            wp dist-archive . ./${{ github.event.repository.name }}.zip
            mkdir build
            unzip ${{ github.event.repository.name }}.zip -d build

        - name: Run plugin check
          uses: wordpress/plugin-check-action@6f5a57e173c065a394b78688f75df543e4011902 # v1.1.5
          with:
            build-dir: './build/${{ github.event.repository.name }}'